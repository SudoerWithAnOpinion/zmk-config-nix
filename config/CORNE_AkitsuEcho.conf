
CONFIG_ZMK_KEYBOARD_NAME="Akitsu-Echo"
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=20

# CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
# CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
# CONFIG_PROSPECTOR_SHOW_MODIFIERS=y


# ZMK sleep and power management configurations
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Fix LVGL snprintf/vsnprintf conflict with Zephyr minimal libc
CONFIG_LV_USE_BUILTIN_SPRINTF=n