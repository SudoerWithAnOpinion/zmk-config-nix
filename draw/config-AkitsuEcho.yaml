draw_config:
  append_colon_to_layer_header: false
  dark_mode: false
  footer_text: "Akitsu Echo"
  glyph_tap_size: 15
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyph_urls:
    akitsu_backspace: "file:config/AkitsuEcho/svg/backspace.svg"
    akitsu_command: "file:config/AkitsuEcho/svg/command.svg"
    akitsu_control: "file:config/AkitsuEcho/svg/control.svg"
    akitsu_delete: "file:config/AkitsuEcho/svg/delete.svg"
    akitsu_escape: "file:config/AkitsuEcho/svg/escape.svg"
    akitsu_lower: "file:config/AkitsuEcho/svg/lower.svg"
    akitsu_option: "file:config/AkitsuEcho/svg/option.svg"
    akitsu_raise: "file:config/AkitsuEcho/svg/raise.svg"
    akitsu_return: "file:config/AkitsuEcho/svg/return.svg"
    akitsu_shift: "file:config/AkitsuEcho/svg/shift.svg"
    akitsu_tab: "file:config/AkitsuEcho/svg/tab.svg"
  use_local_cache: false
  legend_rel_y: 1
  outer_pad_w: 10
  outer_pad_h: 10
  small_pad: 4

  svg_style: |
    svg path { fill: inherit; }

    svg.keymap {
      fill: #ff8a00;
      background-color: #6a6a6a;
      font-family: "Cyber Alert", "Cyber Alert Solid", "Orbitron", "Eurostile", system-ui, sans-serif;
        font-size: 16px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.02em;
    }

    text.tap     { font-weight: 500; }
    text.hold    { font-weight: 400; font-size: 13px; }
    text.shifted { font-weight: 400; font-size: 11px; }
    text.combo, text.left, text.right, text.tl, text.tr, text.bl, text.br { font-size: 10px; }

    text.hold, text.bl, text.br    { text-anchor: middle; dominant-baseline: auto; }
    text.shifted, text.tl, text.tr { text-anchor: middle; dominant-baseline: hanging; }
    text.left, text.tl, text.bl    { text-anchor: start; }
    text.right, text.tr, text.br   { text-anchor: end; }

    text.layer-activator { text-decoration: underline; }
    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right { font-size: 8px; }

    text.label, text.footer {
      fill: #ff8a00;
        stroke: #000000;
        stroke-width: 4;
        paint-order: stroke;
    }
    text.label  { font-weight: bold; text-anchor: start; }
    text.footer { text-anchor: end; dominant-baseline: auto; }

    rect.key, rect.combo, rect.combo-separate { fill: #050505; stroke-width: 0; }
    rect.held, rect.combo.held                { fill: #151515; }
    .layer-Combos rect.key                    { fill: #2a2a2a; }

    path.combo { stroke: #6f3a00; stroke-width: 2; stroke-dasharray: 2, 3; opacity: 0.45; fill: none; }

    text.tl, use.tl { fill: #ff9b1a; }
    text.tr, use.tr { fill: #ff8a00; }
    text.bl, use.bl { fill: #ff7a00; }
    text.br, use.br { fill: #ffab40; }

    use.key.tap { fill: #ff8a00; }
    use.key.hold { fill: #ff9b1a; }
    use.key.shifted { fill: #ffab40; }
    use.key.left, use.key.right, use.key.tl, use.key.tr, use.key.bl, use.key.br { fill: #ff8a00; }

    .keypos-30 text.hold { fill: #ff8a00; }
    .keypos-31 text.hold { fill: #ff9b1a; }
    .keypos-32 text.hold { fill: #ff7a00; font-size: 15px; }
    .keypos-33 text.hold { font-size: 15px; }

    .icon-tabler > path                             { fill: inherit; stroke: inherit; stroke-width: 2; }
    .icon-tabler > path[stroke="none"][fill="none"] { visibility: hidden; }

    @media (prefers-color-scheme: dark) {}
